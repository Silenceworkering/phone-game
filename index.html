<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phone Numbers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="stat-pill">
        <span class="icon">💰</span>
        <div class="stat-stack">
          <span class="label">Баланс</span>
          <span class="value" id="balance">10 000 ₽</span>
        </div>
      </div>
      <div class="stat-pill">
        <span class="icon">🎰</span>
        <div class="stat-stack">
          <span class="label">Прокручено</span>
          <span class="value" id="spinCount">0</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-page="roulette">🎰 Крутка</div>
    <div class="tab" data-page="inventory">📦 Инвентарь <span class="count" id="tabInvCount">0</span></div>
    <div class="tab" data-page="countries">🌍 Страны</div>
    <div class="tab" data-page="market">💱 Рынок</div>
  </div>

  <div class="promo-bar" id="promoBar">
    <div class="promo-bar-head" id="promoBarHead">
      <span class="promo-bar-icon">🎁</span>
      <span class="promo-bar-text">Промокод</span>
      <span class="promo-bar-arrow" id="promoBarArrow">▾</span>
    </div>
    <div class="promo-bar-body" id="promoBarBody">
      <input type="text" class="promo-input" id="promoInput" placeholder="Введите код" maxlength="20" autocomplete="off" spellcheck="false">
      <button class="promo-btn" id="promoBtn" type="button">OK</button>
    </div>
  </div>

  <div class="pages">
    <div class="page page-roulette active" id="page-roulette">
      <div class="country-selector" id="countrySelector"></div>
      <div class="operator-selector" id="operatorSelector"></div>
      <div class="roulette-window" id="rouletteWindow">
        <div class="reels" id="reels"></div>
        <div class="selector-line"></div>
        <div class="result-card" id="resultCard">
          <div class="result-rarity" id="resultRarity"></div>
          <div class="result-flag" id="resultFlag"></div>
          <div class="result-number" id="resultNumber"></div>
          <div class="result-operator" id="resultOperator"></div>
          <div class="result-price" id="resultPrice"></div>
          <div class="result-desc" id="resultDesc"></div>
          <div class="result-actions" id="resultActions">
            <button class="result-btn keep" id="btnKeep" type="button">📦 В инвентарь</button>
            <button class="result-btn sell" id="btnSellNow" type="button">💵 Продать</button>
          </div>
        </div>
      </div>
      <div class="roulette-options">
        <div class="options-label">Минимальная редкость</div>
        <div class="rarity-options" id="rarityOptions"></div>
      </div>
    </div>

    <div class="page" id="page-inventory">
      <div class="inv-selection-bar" id="invSelectionBar">
        <div class="inv-selection-info">
          <span class="inv-selection-count" id="invSelCount">0 выбрано</span>
          <span class="inv-selection-sum" id="invSelSum">0 ₽</span>
        </div>
        <button class="inv-sel-clear" id="invSelClear" type="button">Снять</button>
      </div>
      <div class="inv-filters" id="invFilters"></div>
      <div class="inv-grid" id="invGrid"></div>
    </div>

    <div class="page" id="page-countries">
      <div class="country-list" id="countryList"></div>
    </div>

    <div class="page" id="page-market">
      <div class="market-placeholder">
        <div class="market-icon">📞💱</div>
        <div class="market-title">Рынок номеров</div>
        <div class="market-text">В разработке...</div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="spin-btn" id="spinBtn" type="button">
      <span id="spinBtnLabel">Крутить</span>
      <span class="price" id="spinBtnPrice">350 ₽</span>
    </button>
    <button class="spin-btn x5" id="spinBtn5" type="button">
      <span>Крутить ×5</span>
      <span class="price" id="spinBtn5Price">1 750 ₽</span>
    </button>
  </div>

  <div class="controls" id="controlsInv" style="display:none;">
    <button class="sell-selected-btn" id="sellSelectedBtn" type="button" disabled>
      <span id="sellSelectedLabel">💵 Продать выбранные</span>
      <span class="price" id="sellSelectedPrice">0 ₽</span>
    </button>
    <button class="sell-all-btn" id="sellAllBtn" type="button">
      <span id="sellAllLabel">Всё сразу</span>
      <span class="price" id="sellAllPrice">0 ₽</span>
    </button>
  </div>
</div>

<div class="modal-backdrop" id="sellModal">
  <div class="modal">
    <div class="modal-flag" id="modalFlag"></div>
    <div class="modal-rarity" id="modalRarity"></div>
    <div class="modal-number" id="modalNumber"></div>
    <div class="modal-op" id="modalOp"></div>
    <div class="modal-price-box">
      <div class="modal-price-label">Цена продажи</div>
      <div class="modal-price-value" id="modalPrice"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel" type="button">Отмена</button>
      <button class="modal-btn sell" id="modalSell" type="button">Продать</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="opModal">
  <div class="modal op-modal">
    <div class="op-modal-head">
      <div class="op-modal-flag" id="opFlag"></div>
      <div>
        <div class="op-modal-name" id="opName"></div>
        <div class="op-modal-country" id="opCountry"></div>
      </div>
    </div>
    <div class="op-numbers-list" id="opNumbersList"></div>
    <div class="op-modal-summary">
      <span>Итого:</span>
      <span class="op-total" id="opTotal">0 ₽</span>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="opCancel" type="button">Закрыть</button>
      <button class="modal-btn sell" id="opSellAll" type="button">Продать все</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmModal">
  <div class="modal">
    <div class="modal-flag">💵</div>
    <div class="modal-rarity" style="color:#34c759;">Продажа</div>
    <div class="modal-number" id="confirmText" style="font-size:15px;font-family:inherit;font-weight:700;"></div>
    <div class="modal-price-box">
      <div class="modal-price-label">Вы получите</div>
      <div class="modal-price-value" id="confirmPrice">0 ₽</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="confirmCancel" type="button">Отмена</button>
      <button class="modal-btn sell" id="confirmOk" type="button">Продать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="fireworks" id="fireworks"></div>

<script type="module" src="app.js"></script>
</body>
</html>
